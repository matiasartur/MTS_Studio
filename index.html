<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MTS Studio — Landing pages sob medida</title>
  <meta name="description" content="Criação de landing pages premium: design autoral, código rápido e foco em conversão.">

  <!-- Fonte Inter (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Estilos da página -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- =====================================================
       CABEÇALHO
       ===================================================== -->
  <header class="site-header">
    <div class="header-inner">
      <a href="#topo" class="logo">
        <span class="logo-marca" aria-hidden="true"></span>
        MTS Studio
      </a>

      <!-- Menu do computador -->
      <nav class="nav" aria-label="Principal">
        <a href="#processo">Processo</a>
        <a href="#recursos">Recursos</a>
        <a href="#planos">Planos</a>
        <a href="#perguntas">Perguntas</a>

      <a class="btn btn-escuro cta-top" href="#contato">Solicitar orçamento</a>

      <!-- Botão ☰ (aparece só no celular) -->
      <button class="menu-btn" id="menuBtn" aria-label="Abrir menu" aria-expanded="false" aria-controls="menuMobile">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#1d1d1f" stroke-width="1.5" aria-hidden="true">
          <path d="M3 7h14M3 13h14"/>
        </svg>
      </button>
    </div>

    <!-- Menu do celular: aparece ao tocar no botão ☰ -->
    <nav id="menuMobile" class="menu-mobile" aria-label="Menu do celular">
      <a href="#processo">Processo</a>
      <a href="#recursos">Recursos</a>
      <a href="#planos">Planos</a>
      <a href="#perguntas">Perguntas</a>
