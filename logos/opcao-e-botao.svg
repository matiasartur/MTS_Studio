<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .ink { fill: #1d1d1f; } .ink-s { stroke: #1d1d1f; } .paper-s { stroke: #ffffff; } .paper { fill: #ffffff; } .ac { fill: #0071e3; } .ac-s { stroke: #0071e3; }
    @media (prefers-color-scheme: dark) { .ink { fill: #f5f5f7; } .ink-s { stroke: #f5f5f7; } .paper-s { stroke: #000000; } .paper { fill: #000000; } }
  </style>
  <!-- Opção E · Botão: a sigla dentro do botão em pílula do site -->
  <rect class="ink" x="2" y="18" width="60" height="28" rx="14"/>
  <text x="27" y="37" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" letter-spacing="-0.4" class="paper">MTS</text>
  <circle class="ac" cx="50" cy="32" r="3"/>
</svg>
